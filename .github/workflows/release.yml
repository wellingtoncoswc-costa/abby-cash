name: release
# Tag vX.Y.Z -> constrói e publica api, stt e web no GHCR (ghcr.io/<owner>/abby-cash-<serviço>:<tag>).
on: {push: {tags: ["v*"]}}
permissions: {contents: read, packages: write}
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: api, context: backend, file: backend/Dockerfile}
          - {name: stt, context: stt, file: stt/Dockerfile}
          - {name: web, context: web, file: infra/web.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/abby-cash-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.owner }}/abby-cash-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
