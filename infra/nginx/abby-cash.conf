# Abby Cash: server block NOVO para https://abbycash.abbysystems.com.br (nao altera nenhum server existente).
# Instalar em /etc/nginx/conf.d/abby-cash.conf (ou sites-available + link), ver infra/deploy.md.
# Upstreams: api e web ficam publicados SO em 127.0.0.1 pelo compose (portas 18000 e 18081).
# Se o Nginx do host for um conteiner, troque 127.0.0.1 pelo host/rede correta (ver deploy.md, pre-flight).

# zonas de rate limit (nomes proprios abby_*, nao colidem com os existentes)
limit_req_zone $binary_remote_addr zone=abby_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=abby_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=abby_hook:10m rate=30r/s;

# navegação de browser (Accept: text/html) em caminho que também é rota da SPA (ex.: /admin) vai para a SPA
map $http_accept $abby_html { default 0; "~*text/html" 1; }

upstream abby_api { server 127.0.0.1:18000; keepalive 8; }
upstream abby_web { server 127.0.0.1:18081; keepalive 4; }

server {
    listen 80;
    listen [::]:80;
    server_name abbycash.abbysystems.com.br;
    # desafio ACME do certbot (webroot) e redirecionamento para HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name abbycash.abbysystems.com.br;

    ssl_certificate     /etc/letsencrypt/live/abbycash.abbysystems.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abbycash.abbysystems.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;   # anexos (comprovantes); a API valida o limite real
    server_tokens off;

    # cabecalhos de seguranca (a API tambem os envia; aqui cobrem o web estatico)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # mesma origem para web e API: o cookie de refresh tem Path=/auth
    location = /health { proxy_pass http://abby_api; include /etc/nginx/snippets/abby-proxy.conf; }

    location /webhooks/ {
        limit_req zone=abby_hook burst=60 nodelay;
        client_max_body_size 2m;
        proxy_pass http://abby_api;
        include /etc/nginx/snippets/abby-proxy.conf;
    }

    location ~ ^/auth(/|$) {
        limit_req zone=abby_auth burst=10 nodelay;
        proxy_pass http://abby_api;
        include /etc/nginx/snippets/abby-proxy.conf;
    }

    # mesma lista de rotas do proxy de dev (web/vite.config.ts); demais caminhos sao da SPA
    # (lista conferida contra app.openapi() por backend/tests/core/test_nginx_routes.py)
    location ~ ^/(spaces|accounts|cards|invoices|bills|goals|channels|privacy|categories|transactions|attachments|admin|me)(/|$) {
        error_page 418 = @spa;
        if ($abby_html) { return 418; }
        limit_req zone=abby_api burst=40 nodelay;
        proxy_pass http://abby_api;
        include /etc/nginx/snippets/abby-proxy.conf;
    }

    # SPA: qualquer outro caminho (o conteiner `web` faz o fallback para index.html)
    location / { error_page 418 = @spa; return 418; }

    location @spa {
        proxy_pass http://abby_web;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # add_header em location apaga os do server: repetir os de seguranca
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
